name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak QandQ.zip (jika project diupload sebagai ZIP)
        run: |
          if [ -f QandQ.zip ]; then unzip -o -q QandQ.zip -x ".github/*"; fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: QandQ-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publikasikan ke Releases (mudah diunduh dari HP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Q and Q build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
